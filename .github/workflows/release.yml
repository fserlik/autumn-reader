name: Publicar versión de Windows

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          AUTUMN_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Autumn Reader ${{ github.ref_name }}"
          releaseBody: |
            Autumn Reader ${{ github.ref_name }} para Windows.

            Incluye lectura local sin conexión, arrastre manual de página en móvil, vista general de páginas, atajos configurables en PC y mejoras de biblioteca. Se adjuntan el instalador, la versión portable y el CSV de idiomas.

            `locales.csv` incluye las cadenas de la aplicación en inglés, español, italiano y francés.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
      - name: Preparar ejecutable portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/autumn-reader.exe -Destination artifacts/AutumnReader-PC-portable.exe
      - name: Adjuntar traducciones y publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            locales.csv
            artifacts/AutumnReader-PC-portable.exe
          draft: false
          prerelease: false
