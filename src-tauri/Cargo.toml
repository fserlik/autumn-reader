[package]
name = "autumn-reader"
version = "0.4.1"
description = "A desktop book reader"
authors = ["Autumn Reader contributors"]
edition = "2021"

[lib]
name = "autumn_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
percent-encoding = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Foundation", "Services_Store", "Win32_Foundation", "Win32_UI_Shell"] }
windows-collections = "0.2"
windows-future = "0.2"
